name: DiaSMP
version: 1.0.0
main: com.diasmp.DiaSMP
api-version: '1.21'
commands:
  team:
    description: Manage your SMP team.
    usage: '/team <create|invite|join|leave|kick|disband|info|list>'
  home:
    description: Teleport to your home location.
    usage: '/home'
  sethome:
    description: Set your home location.
    usage: '/sethome'
  rtp:
    description: Randomly teleport to a safe location.
    usage: '/rtp'
  gaps:
    description: Craft or interact with custom golden apples.
    usage: '/gaps'
